# pubspec.yaml
name: trip_split
description: Smart trip expense splitter with dietary preferences

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  pdf: ^3.13.0
  printing: ^5.15.0
  http: ^1.2.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/applogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/applogo.png